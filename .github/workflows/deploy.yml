name: Fast Build and Deploy Sims

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 啟用套件引擎 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. 建立發布目錄並自動處理各類模擬專案
        run: |
          mkdir -p dist
          cp index.html style.css main.js sims-data.json dist/
          [ -d "favicon" ] && cp -r favicon dist/ || true

          if [ -d "simulations" ]; then
            for dir in simulations/*/ ; do
              [ -e "$dir" ] || continue
              sim_name=$(basename "$dir")
              mkdir -p "dist/sims/$sim_name"

              # 【自動判別機制】檢查是否含有 package.json
              if [ -f "${dir}package.json" ]; then
                echo "[AI Studio 專案] 正在編譯: $sim_name"
                pushd "$dir"
                bun install
                bunx vite build --base=./ --outDir "../../dist/sims/$sim_name"
                popd
              else
                echo "[純 HTML 專案] 直接複製靜態檔案: $sim_name"
                # 複製該資料夾下所有檔案至發布區
                cp -r "${dir}"* "dist/sims/$sim_name/"
                # 移除複製過去的 thumbnail.png，避免佔用模擬目錄空間
                rm -f "dist/sims/$sim_name/thumbnail.png"
              fi

              # 統一處理預覽縮圖：若該專案內有 thumbnail.png，複製供首頁讀取
              if [ -f "${dir}thumbnail.png" ]; then
                mkdir -p "dist/simulations/$sim_name"
                cp "${dir}thumbnail.png" "dist/simulations/$sim_name/thumbnail.png"
              fi
            done
          fi

      - name: 4. 封裝網站成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 5. 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
