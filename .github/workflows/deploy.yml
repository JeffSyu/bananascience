name: Fast Build and Deploy Sims

on:
  push:
    branches: ["aotu-load"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 啟用極速套件引擎 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. 建立發布目錄並打包所有模擬專案
        run: |
          mkdir -p dist
          
          cp index.html style.css main.js sims-data.json dist/
          
          [ -d "favicon" ] && cp -r favicon dist/ || true

          if [ -d "simulations" ]; then
            for dir in simulations/*/ ; do
              [ -e "$dir" ] || continue
              sim_name=$(basename "$dir")
              echo "正在打包模擬專案: $sim_name"
              
              # 1. 編譯 AI Studio 專案至 dist/sims/[project_name]
              pushd "$dir"
              bun install
              bunx vite build --base=./ --outDir "../../dist/sims/$sim_name"
              popd

              # 2. 若該專案內有 thumbnail.png，複製到對應路徑供首頁讀取
              if [ -f "${dir}thumbnail.png" ]; then
                mkdir -p "dist/simulations/$sim_name"
                cp "${dir}thumbnail.png" "dist/simulations/$sim_name/thumbnail.png"
              fi
            done
          fi

      - name: 4. 封裝網站成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 5. 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
