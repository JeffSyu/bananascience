<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香蕉老師的科學互動實驗室</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./main.js" defer></script>
</head>
<body>

  <!-- 標頭區：固定於畫面最上方，向下滾動時自動向上縮小、靠左並隱藏小標題 -->
  <div class="header-spacer">
    <header class="site-header" id="siteHeader">
      <div class="header-inner">
        <h1>香蕉老師的科學互動實驗室</h1>
        <p class="subtitle">香蕉老師的教學模擬分享，透過即時互動與視覺化，讓物理化學更容易</p>
      </div>
    </header>
  </div>

  <!-- 主內容雙欄容器 -->
  <div class="layout-container">

    <!-- 左側篩選欄 -->
    <aside class="filter-sidebar" aria-label="模擬教材篩選條件">
      <div class="sidebar-search">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="搜尋模擬名稱或關鍵字..."
          aria-label="搜尋模擬名稱或關鍵字"
        />
      </div>

      <!-- 篩選群組容器（由 main.js 讀取 sims-data.json 自動生成） -->
      <div id="filterGroupsContainer"></div>
    </aside>

    <!-- 右側模擬教材清單 -->
    <main class="catalog-main">
      <!-- 動態篩選條件移除列（左）與結果統計（右） -->
      <div class="catalog-toolbar">
        <div class="active-filters" id="activeFilters"></div>
        <div class="result-stats" id="resultStats">載入中...</div>
      </div>

      <!-- 模擬教材卡片網格（由 main.js 讀取 sims-data.json 自動生成） -->
      <div class="sim-grid" id="simGrid"></div>

      <!-- 無符合篩選結果時的提示畫面 -->
      <div class="empty-state hidden" id="emptyState">
        <p id="emptyStateText">找不到同時符合目前篩選條件。</p>
        <button type="button" class="reset-btn" id="resetFilterBtn" onclick="clearAllFilters()">清除所有篩選條件</button>
      </div>
    </main>

  </div>

  <footer>
    <p>© BananScience 香蕉老師的科學互動實驗室 · Powered by AI Studio &amp; GitHub Actions</p>
  </footer>

</body>
</html>
